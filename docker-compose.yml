version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: phonefarm
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: phonefarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://phonefarm:secret@postgres:5432/phonefarm
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_secret
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://phonefarm:secret@postgres:5432/phonefarm
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_secret
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: